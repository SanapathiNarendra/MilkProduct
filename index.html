<!DOCTYPE html>
<html>
    <head>
        <title>
            add product
        </title>
        <script>
    function addProduct(){

        var productName = document.getElementById("ddlProductName").value;
        var productQuantity = document.getElementById("ddlProductQuantity").value;
        var productPrice = document.getElementById("numProductPrice").value;
        var contactNumber = document.getElementById("numContactnumber").value;
        var location = document.getElementById("txtLocation").value;

        alert(
         
        productName + " \n " +
        productQuantity + "\n" +
        productPrice + "\n" +
        contactNumber + "\n" +
        location);
        
    }
</script>


        
    </head>
    <body>
<div>
    <div class="milkmenu">
        <label  class="productName" id="lblProductName" for="txtProductName">Product Name</label>       
        <select id="ddlProductName" textaligncenter="ddlProductName">
            <option value="BuffelloMilk">Buffello Milk</option>
            <option value="Curd">Curd</option>
            <option value="Ghee">Ghee</option>
            <option value="CowMilk">Cow Milk</option>
            <option value="RoseMILk">Rose Milk</option>
            <option value="Panner">Panner</option>
            <option value="butter">Butter</option>
            <option value="Lassi">Lassi</option>
            <option value="ButterMilk">ButterMilk</option>
        </select>
        </div>
    
        <label id="lblProductQuantity" for="numProductQuantity">Product Quantity</label>  
        <select id="ddlProductQuantity">
            <option value="250">250ml</option>
            <option value="500">500ml</option>
            <option value="750">750ml</option>
            <option value="1000">1000ml</option>
            <option value="2L">2L</option>
        </select>
        

        <label id ="lblProductPrice" for="numProductPrice">Product Price</label>
        <input id="numProductPrice" type="number">
        
        
        <label id="lblConcactNumber" for="ContactNumber">ContactNumber</label> 
        <input id="numContactnumber" type="number">
        
        <label id="lblLocation" for="txtLocation">Location</label>
        <input id="txtLocation" type="text">
        

        <button id="btnAddProdut" onclick="addProduct()">Add product</button>
</div>
    </body>

</html>
